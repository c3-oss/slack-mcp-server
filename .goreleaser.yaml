version: 2

project_name: slack-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: slack-mcp-server
    main: ./cmd/slack-mcp-server
    binary: slack-mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/c3-oss/slack-mcp-server/pkg/version.Version={{.Version}}
      - -X github.com/c3-oss/slack-mcp-server/pkg/version.CommitHash={{.Commit}}
      - -X github.com/c3-oss/slack-mcp-server/pkg/version.BuildTime={{.Date}}
      - -X github.com/c3-oss/slack-mcp-server/pkg/version.BinaryName=slack-mcp-server

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Software Bill of Materials — one SPDX SBOM per archive, generated by
# Syft. Requires `syft` on PATH (installed by the release workflow).
sboms:
  - id: default
    artifacts: archive
    documents:
      - '{{ .ArtifactName }}.spdx.json'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: '{{ .ProjectName }} {{ .Version }}'
  extra_files:
    - glob: ./docker-compose.yml
    - glob: ./.env.dist
